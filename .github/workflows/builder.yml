# Keep the workflow filename already registered on main, so the branch can be
# selected in the existing Run workflow dropdown without modifying main.
name: RE-CP-03 HNAT418 diagnostic firmware

on:
  push:
    branches:
      - debug_hnat418
  workflow_dispatch:
    inputs:
      LAN_IP:
        description: Fresh-install LAN IPv4 (preserved config is not overwritten)
        required: true
        default: '192.168.3.1'
      NO_DOCKERMAN:
        description: Compatibility input from main (debug config remains fixed)
        type: boolean
        default: false
      SHOW_PATCHED_CODE:
        description: Compatibility input from main (sources are preserved in build artifacts)
        type: boolean
        default: false
      ssh:
        description: Compatibility input from main (external build SSH is disabled)
        default: 'false'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl subversion time jq zstd libzstd-dev bzip2
          sudo mkdir -p /cache/hnat418-firmware
          sudo chown -R "$USER:$USER" /cache/hnat418-firmware
      - name: Build the pinned diagnostic firmware
        env:
          HNAT418_LAN_IP: ${{ inputs.LAN_IP }}
          HNAT418_CACHE: /cache/hnat418-firmware
          JOBS: '4'
        run: |
          set -o pipefail
          bash build-debug.sh 2>&1 | tee /cache/hnat418-firmware/build.log
      - name: Save firmware, Windows runner and matching kernel build
        uses: actions/upload-artifact@v4
        with:
          name: RE-CP-03-HNAT418-DEBUG
          path: /cache/hnat418-firmware/delivery/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Save build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNAT418-build-log
          path: /cache/hnat418-firmware/build.log
          retention-days: 7
